syntax = "proto3";

package me.kasuki.kstaff.api.staff;

import "itemstack.proto";

message Profile {
  string uuid = 1;
  bool staffMode = 2;
  bool staffChat = 3;
  optional me.kasuki.kstaff.utilities.item.ItemStackArray savedInventory = 4;
  optional me.kasuki.kstaff.utilities.item.ItemStackArray savedArmor = 5;
}
